name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `npm publish --provenance` requires npm CLI 11.5.1+ for npm Trusted
      # Publishing OIDC. bun publish doesn't yet support provenance, so we
      # use bun for install/test and npm for the publish step itself.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      # Auth is via npm Trusted Publishing (OIDC). Configure on npmjs.com:
      # https://www.npmjs.com/package/smallest-power-of-two/access → "Trusted
      # Publisher" → add GitHub Actions / cinderblock / smallest-power-of-two /
      # publish.yml / (no environment).
      - run: npm publish --provenance --access public
